# Current source snapshot: review docs/validation.md before deployment.
esphome:
  name: hvac-solarheater
  friendly_name: HVAC-SolarHeater
  min_version: 2026.9.0
  includes:
  - <circulation_request.h>
  - circulation_request.h
  - <heatpump_controller.h>
  - heatpump_controller.h
  - <solar_controller.h>
  - solar_controller.h
  on_boot:
    priority: -100
    then:
    - switch.turn_off: compressor
    - switch.turn_off: pumphot
    - switch.turn_off: pumpcold
    - lambda: |-
        id(controller).failures = id(failure_count);
        id(controller).overheat_hold = id(overheat_latched);
        id(controller).freeze_hold = id(freeze_latched);
        id(controller).hot_hold = id(hot_latched);
        id(controller).begin(millis());
        id(last_tick_ms) = millis();
        id(controller_ready) = true;
  on_shutdown:
    priority: 700
    then:
    - switch.turn_off: compressor
    - switch.turn_off: pumphot
    - switch.turn_off: pumpcold
    - output.turn_off: pwm_pump
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
  baud_rate: 0
  level: INFO
api:
  encryption:
    key: !secret solar_api_key
  reboot_timeout: 0s
ota:
- platform: esphome
  password: !secret solar_ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: !secret gateway
    subnet: !secret subnet
    static_ip: !secret solar_ip
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password
  reboot_timeout: 0s
  power_save_mode: none
web_server:
  port: 80
  version: 3
  local: false
  js_include: heatpump_web_bundle.js
  log: false
  js_url: ''
  ota: false
  auth:
    username: admin
    password: admin
captive_portal: {}
preferences:
  flash_write_interval: 5min
spi:
  clk_pin: GPIO1
  miso_pin: GPIO3
  interface: software
one_wire:
- platform: gpio
  pin: GPIO2
globals:
- id: floor_request
  type: hp::CirculationRequest
  restore_value: false
  initial_value: 'hp::CirculationRequest{}'
- id: floor_request_accepted
  type: bool
  restore_value: false
  initial_value: 'false'
- id: controller
  type: hp::Controller
  restore_value: false
- id: solar_controller
  type: hp::SolarController
  restore_value: false
- id: controller_ready
  type: bool
  initial_value: 'false'
  restore_value: false
- id: heat_demand
  type: bool
  initial_value: 'false'
  restore_value: false
- id: failure_count
  type: unsigned int
  initial_value: '0'
  restore_value: true
- id: runtime_seconds
  type: double
  initial_value: '0'
  restore_value: true
- id: last_tick_ms
  type: uint32_t
  initial_value: '0'
  restore_value: false
- id: collector_at
  type: uint32_t
  initial_value: '0'
  restore_value: false
- id: collector_seen
  type: bool
  initial_value: 'false'
  restore_value: false
- id: pwm_level
  type: float
  initial_value: '0.0'
  restore_value: false
- id: overheat_latched
  type: bool
  restore_value: true
  initial_value: 'false'
- id: freeze_latched
  type: bool
  restore_value: true
  initial_value: 'false'
- id: hot_latched
  type: bool
  restore_value: true
  initial_value: 'false'
sensor:
- platform: packet_transport
  id: floor_circulation_request_rx
  provider: househeating
  transport_id: circulation_transport
  remote_id: floor_circulation_request_value
  internal: true
  on_raw_value:
    then:
      - lambda: id(floor_request).receive(x, millis());
- platform: max6675
  name: Tank Temperature Backup
  id: tank_temp2
  cs_pin: GPIO18
  update_interval: 30s
  filters:
  - offset: 2
- platform: max6675
  name: Solar Collector Temperature
  id: collector_temp
  cs_pin: GPIO22
  update_interval: 10s
  filters:
  - offset: -10
  on_value:
    then:
    - lambda: id(collector_at) = millis(); id(collector_seen) = true;
- platform: dallas_temp
  id: cold
  address: 12250642659477223464
  update_interval: 10s
  name: Cold HVAC Out
  icon: mdi:snowflake-thermometer
  on_value:
    then:
    - lambda: id(controller).cold_out.update(x, millis());
- platform: dallas_temp
  id: coldin
  address: 8791893538818171944
  update_interval: 10s
  name: Cold HVAC In
  icon: mdi:snowflake-melt
  filters:
  # 2026-10-04 pump-only relative matching; outlet reference retained.
  - offset: -0.125
  on_value:
    then:
    - lambda: id(controller).cold_in.update(x, millis());
- platform: dallas_temp
  id: hot
  address: 15709401675737413928
  update_interval: 10s
  name: Hot HVAC Out
  on_value:
    then:
    - lambda: id(controller).hot_out.update(x, millis());
- platform: dallas_temp
  id: hotin
  address: 11385966924179306792
  update_interval: 10s
  name: Hot HVAC In
  filters:
  # 2026-10-04 pump-only relative matching; outlet reference retained.
  - offset: 3.375
  on_value:
    then:
    - lambda: id(controller).hot_in.update(x, millis());
- platform: dallas_temp
  id: motortemp
  address: 1009668984676247336
  update_interval: 10s
  name: Compressor Temperature
  on_value:
    then:
    - lambda: id(controller).motor.update(x, millis());
- platform: dallas_temp
  id: tanktemp
  address: 1297903758873425704
  update_interval: 30s
  name: Storage Tank Temperature
  on_value:
    then:
    - lambda: id(controller).tank.update(x, millis());
- platform: pulse_counter
  id: flowhot
  pin:
    number: GPIO36
    mode:
      input: true
      pullup: false
  name: HVAC Hot Water flow
  update_interval: 2s
  filters:
  - multiply: 0.00174
  unit_of_measurement: L/min
  accuracy_decimals: 2
  on_value:
    then:
    - lambda: id(controller).flow_hot.update(x, millis());
  internal_filter: 10us
  state_class: measurement
- platform: pulse_counter
  id: flowcold
  pin:
    number: GPIO39
    mode:
      input: true
      pullup: false
  name: HVAC Cold Water flow
  update_interval: 2s
  filters:
  - multiply: 0.003
  unit_of_measurement: L/min
  accuracy_decimals: 2
  on_value:
    then:
    - lambda: id(controller).flow_cold.update(x, millis());
  internal_filter: 10us
  state_class: measurement
- platform: template
  name: HVAC Thermal Power Output
  id: thermal_power_watts
  unit_of_measurement: W
  accuracy_decimals: 0
  update_interval: never
  lambda: |-
    if (!id(compressor).state) return 0.0f;
    if (!id(controller).sensors_ok(millis())) return 0.0f;
    float dt = id(hot).state - id(hotin).state;
    float flow = id(flowhot).state;
    if (flow < id(min_flow).state) return 0.0f;
    return std::max(0.0f, flow * dt * 69.77f);
  device_class: power
  state_class: measurement
- platform: integration
  sensor: thermal_power_watts
  name: Power Output Total
  id: thermal_energy_total
  unit_of_measurement: Wh
  time_unit: h
  integration_method: left
  restore: true
  device_class: energy
  state_class: total_increasing
  accuracy_decimals: 1
- platform: template
  name: Estimated Compressor Power
  id: compressor_power_watts
  unit_of_measurement: W
  accuracy_decimals: 0
  update_interval: never
  lambda: 'return id(compressor).state ? 1300.0f : 0.0f;'
  device_class: power
  state_class: measurement
- platform: integration
  sensor: compressor_power_watts
  name: HVAC Power Consumption
  id: compressor_power_consumption
  unit_of_measurement: Wh
  time_unit: h
  integration_method: left
  restore: true
  device_class: energy
  state_class: total_increasing
  accuracy_decimals: 1
- platform: template
  name: Compressor Runtime
  id: runtime_hours
  unit_of_measurement: h
  accuracy_decimals: 3
  update_interval: 5s
  lambda: return id(runtime_seconds) / 3600.0;
  state_class: total_increasing
- platform: template
  name: Restart Delay Remaining
  id: restart_remaining
  unit_of_measurement: s
  accuracy_decimals: 0
  update_interval: 1s
  lambda: return id(controller).remaining(millis());
- platform: template
  name: Start Failure Count
  id: start_failure_count
  unit_of_measurement: ''
  accuracy_decimals: 0
  update_interval: 5s
  lambda: return id(controller).failures;
- platform: template
  name: Hot Side Temperature Difference
  id: hot_delta
  unit_of_measurement: °C
  accuracy_decimals: 2
  update_interval: 5s
  lambda: return id(hot).state - id(hotin).state;
- platform: template
  name: Cold Side Temperature Difference
  id: cold_delta
  unit_of_measurement: °C
  accuracy_decimals: 2
  update_interval: 5s
  lambda: return id(coldin).state - id(cold).state;
- platform: template
  name: Hot Flow Smoothed
  id: hot_flow_avg
  unit_of_measurement: L/min
  accuracy_decimals: 2
  update_interval: 5s
  lambda: return id(controller).avg_hot;
- platform: template
  name: Cold Flow Smoothed
  id: cold_flow_avg
  unit_of_measurement: L/min
  accuracy_decimals: 2
  update_interval: 5s
  lambda: return id(controller).avg_cold;
- platform: wifi_signal
  name: WiFi Strength
  id: wifi_stats
  update_interval: 60s
output:
- platform: ledc
  id: pwm_pump
  pin: GPIO0
  frequency: 1500 Hz
  min_power: 0%
  max_power: 100%
- platform: gpio
  id: alarm_led
  pin: GPIO23
switch:
- platform: gpio
  pin: GPIO17
  inverted: false
  id: dallas_temppower
  icon: mdi:restart
  restore_mode: ALWAYS_ON
  internal: true
- platform: gpio
  pin: GPIO25
  inverted: false
  id: compressor
  icon: mdi:restart
  restore_mode: ALWAYS_OFF
  internal: true
- platform: gpio
  pin: GPIO14
  inverted: false
  id: pumphot
  icon: mdi:fire
  restore_mode: ALWAYS_OFF
  internal: true
- platform: gpio
  pin: GPIO27
  inverted: false
  id: pumpcold
  icon: mdi:snowflake
  restore_mode: ALWAYS_OFF
  internal: true
- platform: gpio
  pin: GPIO4
  inverted: true
  id: compressorcool
  icon: mdi:valve
  restore_mode: ALWAYS_OFF
  internal: true
number:
- platform: template
  name: Startup Heat Transfer Window
  id: startup_response_window
  min_value: 60
  max_value: 300
  step: 30
  initial_value: 60
  unit_of_measurement: s
  entity_category: config
  icon: mdi:timer-outline
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
- platform: template
  name: Solar Heater Setpoint
  id: tank_temp_setpoint
  min_value: 30
  max_value: 70
  step: 1.0
  initial_value: 55
  unit_of_measurement: °C
  icon: mdi:thermometer-lines
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
- platform: template
  name: Minimum Circuit Flow
  id: min_flow
  min_value: 0.5
  max_value: 15
  step: 0.1
  initial_value: 1
  unit_of_measurement: L/min
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
  entity_category: config
- platform: template
  name: Start Response Threshold
  id: response_threshold
  min_value: 0.2
  max_value: 5
  step: 0.1
  initial_value: 0.5
  unit_of_measurement: °C
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
  entity_category: config
- platform: template
  name: Cold Outlet Cutoff
  id: cold_cutoff
  min_value: -22
  max_value: -5
  step: 1
  initial_value: -20
  unit_of_measurement: °C
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
  entity_category: config
- platform: template
  name: Cold Outlet Recovery
  id: cold_recovery
  min_value: -21
  max_value: 5
  step: 1
  initial_value: -17
  unit_of_measurement: °C
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
  entity_category: config
- platform: template
  name: Tank Safety Limit
  id: tank_safety_limit
  min_value: 50
  max_value: 85
  step: 1
  initial_value: 75
  unit_of_measurement: °C
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
  entity_category: config
- platform: template
  name: Hot Outlet Safety Limit
  id: outlet_safety_limit
  min_value: 50
  max_value: 95
  step: 1
  initial_value: 80
  unit_of_measurement: °C
  optimistic: true
  restore_value: true
  on_value:
    - script.execute: persist_user_settings
  entity_category: config
text_sensor:
- platform: template
  name: Hot Pump Source
  id: hot_pump_source
- platform: template
  name: System Status
  id: system_status
- platform: template
  name: System Status JSON
  id: system_status_json
- platform: template
  name: Last Error
  id: last_error
- platform: template
  name: Function
  id: function
- platform: template
  name: Solar Pump Speed
  id: pump_speed
  lambda: return {std::to_string(int(id(pwm_level) * 100.0f)) + "%"};
  update_interval: 5s
- platform: template
  name: Solar Pump Control State
  lambda: return std::string(id(solar_controller).reason);
  update_interval: 5s
binary_sensor:
- platform: template
  name: Floor Circulation Requested
  id: floor_circulation_requested
  lambda: return id(floor_request).requested(millis());
- platform: template
  name: Floor Circulation Accepted
  id: floor_circulation_accepted
  lambda: return id(floor_request_accepted);
- platform: template
  name: Floor Circulation Link
  id: floor_circulation_link
  device_class: connectivity
  lambda: return id(floor_request).fresh(millis());
- platform: template
  name: Compressor Running
  id: compressor_running
  lambda: return id(compressor).state;
- platform: template
  name: Hot Pump Running
  id: hot_pump_running
  lambda: return id(pumphot).state;
- platform: template
  name: Cold Pump Running
  id: cold_pump_running
  lambda: return id(pumpcold).state;
- platform: template
  name: Heating Requested
  id: heating_requested
  lambda: return id(heat_demand);
- platform: template
  name: Heatpump Fault
  id: heatpump_fault
  lambda: return id(controller).fault != hp::Fault::None;
button:
- platform: template
  name: Reset Total Heat Energy
  id: reset_heat_energy
  on_press:
    then:
    - lambda: id(thermal_power_watts).update();
    - sensor.integration.reset: thermal_energy_total
    - lambda: global_preferences->sync();
- platform: template
  name: Reset Heatpump Fault
  id: reset_heatpump_fault
  on_press:
    then:
    - lambda: |-
        if (id(controller).reset(id(climatehot).mode == climate::CLIMATE_MODE_OFF && !id(heat_demand), millis())) {
          id(failure_count) = 0;
          id(overheat_latched) = false; id(freeze_latched) = false; id(hot_latched) = false;
          failure_count->update(); overheat_latched->update(); freeze_latched->update(); hot_latched->update();
          global_preferences->sync();
          id(last_error).publish_state("Fault acknowledged");
        } else {
          ESP_LOGW("heatpump", "Reset refused: set thermostat OFF and ensure valid sensors and safe temperatures");
        }
- platform: restart
  name: Device Restart
interval:
- interval: 1s
  then:
  - lambda: |
      if (!id(controller_ready)) return;
      auto &c = id(controller);
      uint32_t now = millis();
      if (id(compressor).state) id(runtime_seconds) += uint32_t(now - id(last_tick_ms)) / 1000.0;
      id(last_tick_ms) = now;
      c.min_flow = id(min_flow).state;
      c.response_delta = id(response_threshold).state;
      c.response_timeout_ms = uint32_t(id(startup_response_window).state * 1000);
      c.freeze_stop = id(cold_cutoff).state;
      c.freeze_clear = std::max(id(cold_recovery).state, c.freeze_stop + 1.0f);
      c.tank_limit = id(tank_safety_limit).state;
      c.outlet_limit = id(outlet_safety_limit).state;
      auto previous_fault = c.fault;
      c.tick(now, id(heat_demand));
      // De-energize the compressor before any flash writes.
      if (!c.compressor && id(compressor).state) id(compressor).turn_off();
      bool persist = id(failure_count) != c.failures || id(overheat_latched) != c.overheat_hold
        || id(freeze_latched) != c.freeze_hold || id(hot_latched) != c.hot_hold;
      id(failure_count) = c.failures;
      id(overheat_latched) = c.overheat_hold;
      id(freeze_latched) = c.freeze_hold;
      id(hot_latched) = c.hot_hold;
      if (persist) {
        failure_count->update(); overheat_latched->update(); freeze_latched->update(); hot_latched->update();
        global_preferences->sync();
      }
      // HVAC remains sole relay owner. External demand cannot withdraw HVAC
      // flow proof, heating or overrun, and never enables the cold pump/compressor.
      const bool floor_requested = id(floor_request).requested(now);
      id(floor_request_accepted) = floor_requested && c.fault == hp::Fault::None
          && c.physical_fault(now) == hp::Fault::None;
      const bool hot_required = c.pumps || id(floor_request_accepted);
      // Establish pumps before energizing the compressor.
      if (hot_required) {
        if (!id(pumphot).state) id(pumphot).turn_on();
      } else if (id(pumphot).state) id(pumphot).turn_off();
      if (c.pumps) {
        if (!id(pumpcold).state) id(pumpcold).turn_on();
      } else if (id(pumpcold).state) id(pumpcold).turn_off();
      if (c.compressor && !id(compressor).state) id(compressor).turn_on();
      id(thermal_power_watts).update();
      id(compressor_power_watts).update();
      if (c.fault != hp::Fault::None) id(alarm_led).turn_on();
      else id(alarm_led).turn_off();
      if (c.fault != hp::Fault::None && c.fault != previous_fault)
        id(last_error).publish_state(c.fault_text());
      std::string status = c.phase_text();
      if (id(floor_request_accepted) && !c.pumps) status = "Floor circulation; " + status;
      else if (floor_requested && !id(floor_request_accepted)) status += "; floor circulation blocked";
      const std::string pump_source = c.pumps ? (id(floor_request_accepted) ? "HVAC + floor" : "HVAC")
          : (id(floor_request_accepted) ? "Floor" : "Off");
      if (id(hot_pump_source).state != pump_source) id(hot_pump_source).publish_state(pump_source);
      if (c.compressor && (c.flow_hot.value > 25.0f || c.flow_cold.value > 25.0f))
        status += "; warning: flow above 25 L/min";
      if (c.remaining(now) && !c.compressor)
        status += "; restart delay " + std::to_string(c.remaining(now)) + " s";
      if (id(system_status).state != status) id(system_status).publish_state(status);
      std::string fn = c.compressor ? "Heating" : (hot_required ? "Circulating" : "Idle");
      if (id(function).state != fn) id(function).publish_state(fn);
      char json[220];
      snprintf(json, sizeof(json), "{\"fault\":%d,\"phase\":%d,\"restart_seconds\":%u,\"failures\":%u}",
        int(c.fault), int(c.phase), unsigned(c.remaining(now)), c.failures);
      if (id(system_status_json).state != json) id(system_status_json).publish_state(json);
- interval: 1s
  then:
  - lambda: |-
      const uint32_t now = millis();
      const bool collector_valid = id(collector_seen)
        && uint32_t(now - id(collector_at)) <= 25000;
      const bool tank_valid = id(controller).tank.valid(now, 70000, -40, 125);
      // tanktemp is the existing, owner-labelled Storage Tank Bottom probe.
      const float level = id(solar_controller).tick(id(collector_temp).state,
        id(tanktemp).state, id(tank_temp_setpoint).state, collector_valid, tank_valid, now);
      id(pwm_pump).set_level(level);
      id(pwm_level) = level;
climate:
- platform: thermostat
  on_boot_restore_from: MEMORY
  on_control:
    - script.execute: persist_user_settings
  id: climatehot
  name: HVAC Heater
  sensor: tanktemp
  icon: mdi:thermostat
  min_heating_off_time: 300s
  min_heating_run_time: 0s
  min_idle_time: 60s
  heat_action:
  - lambda: id(heat_demand) = true;
  idle_action:
  - lambda: id(heat_demand) = false;
  default_preset: Winter
  preset:
  - name: Summer
    default_target_temperature_low: 40 °C
  - name: Winter
    default_target_temperature_low: 50 °C
  visual:
    min_temperature: 30
    max_temperature: 70
    temperature_step: 1
  heat_deadband: 7 °C
  heat_overrun: 0.7 °C
  startup_delay: true

# Receive a refreshed circulation request directly; HA is not in this pump-control path.
udp:
  id: circulation_udp
  port: 18512
  addresses: [!secret circulation_broadcast]

packet_transport:
  - platform: udp
    id: circulation_transport
    udp_id: circulation_udp
    update_interval: 5s
    ping_pong_enable: true
    ping_pong_recycle_time: 60s
    providers:
      - name: househeating
        encryption: !secret circulation_transport_key

# Commit settings after native components have queued their updated values.
# Runtime/energy counters retain their existing periodic checkpoint behavior.
script:
  - id: persist_user_settings
    mode: restart
    then:
      - delay: 250ms
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGW("settings", "Settings save failed; periodic retry remains enabled");
          } else {
            ESP_LOGD("settings", "Settings saved to flash");
          }
