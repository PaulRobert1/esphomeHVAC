# Copy to secrets.yaml and replace example values before installation.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "CHANGE_ME_WIFI_PASSWORD"
fallback_ap_ssid: "HVAC-Recovery"
fallback_ap_password: "CHANGE_ME_RECOVERY_PASSWORD"
floor_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
solar_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
floor_ota_password: "CHANGE_ME_FLOOR_OTA"
solar_ota_password: "CHANGE_ME_SOLAR_OTA"
# Use the SAME private transport key on both controllers.
circulation_transport_key: "CHANGE_ME_SHARED_CIRCULATION_KEY"
circulation_broadcast: "192.0.2.255"
solar_ip: "192.0.2.125"
gateway: "192.0.2.1"
subnet: "255.255.255.0"
